name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frontmatter, resources and scaffolding
        run: |
          python scripts/validate_skill.py
          python -m unittest discover -s tests -v
        # Compilation tests skip automatically if XeLaTeX is unavailable.
